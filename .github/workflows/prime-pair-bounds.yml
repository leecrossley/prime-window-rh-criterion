name: Verify prime-pair bounds

on:
  push:
    branches: [main]
    paths:
      - 'results/prime-window-power-samples/**'
      - '.github/workflows/prime-pair-bounds.yml'
  pull_request:
    paths:
      - 'results/prime-window-power-samples/**'
      - '.github/workflows/prime-pair-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Prime-pair bounds at 160 and 256 bits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce the finite bounds and filter examples
        working-directory: results/prime-window-power-samples/pairs
        run: |
          python3 -m venv "$RUNNER_TEMP/prime-pair-env"
          python="$RUNNER_TEMP/prime-pair-env/bin/python"
          "$python" -m pip install 'python-flint==0.9.0'
          for bits in 160 256; do
            "$python" -B check_pairs.py --bits "$bits"
            "$python" -B check_theta.py --bits "$bits"
            "$python" -B check_filter.py --bits "$bits"
          done
          "$python" -B check_odd_mean_square.py --bits 160 --mesh 4000
          "$python" -B check_odd_mean_square.py --bits 256 --mesh 8000
          "$python" -B check_odd_density_integrals.py

      - name: Check square-block certificates and their interpreter settings
        working-directory: results/prime-window-power-samples/square-blocks
        env:
          PYTHON: ${{ runner.temp }}/prime-pair-env/bin/python
        run: |
          for mode in 1 2; do
            if output=$(PYTHONOPTIMIZE="$mode" sh replay.sh 2>&1); then
              exit 1
            fi
            test "$output" = "Square-block certificates require Python assertions. Disable optimisation."
          done
          sh replay.sh

  lean:
    name: Replay the power-sampling Lean proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Run the pinned Linux replay
        working-directory: results/prime-window-power-samples
        run: bash verify-linux.sh
