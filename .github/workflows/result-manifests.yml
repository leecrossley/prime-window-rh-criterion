name: Result manifests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      geometric_target:
        description: Optional geometric proof replay
        type: choice
        default: none
        options: [none, rank, window, proof, compare]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh verify-collection.sh
  geometric:
    if: github.event_name == 'workflow_dispatch' && inputs.geometric_target != 'none'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the hosted runner for the archive
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          if (( $(sysctl -n vm.max_map_count) < 1048576 )); then
            sudo sysctl -w vm.max_map_count=1048576
          fi
          df -h .
      - name: Replay the geometric proof
        env:
          TARGET: ${{ inputs.geometric_target }}
        run: bash results/geometric-window-descent/hosted-replay.sh "$TARGET"
      - name: Save the transcript and declaration lists
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geometric-${{ inputs.geometric_target }}-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-evidence/
          if-no-files-found: warn
          retention-days: 30
