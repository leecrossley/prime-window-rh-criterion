name: Result manifests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      geometric_target:
        description: Optional geometric proof replay
        type: choice
        default: none
        options: [none, rank, window, proof, compare, mizusawa-units, mizusawa-rank, mizusawa, tame-eight, tame-eight-rh]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh verify-collection.sh
  geometric:
    if: github.event_name == 'workflow_dispatch' && inputs.geometric_target != 'none' && inputs.geometric_target != 'compare' && inputs.geometric_target != 'tame-eight-rh'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the hosted runner for the archive
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          if (( $(sysctl -n vm.max_map_count) < 1048576 )); then
            sudo sysctl -w vm.max_map_count=1048576
          fi
          df -h .
      - name: Replay the geometric proof
        env:
          TARGET: ${{ inputs.geometric_target }}
        run: bash results/geometric-window-descent/hosted-replay.sh "$TARGET"
      - name: Save the transcript and declaration lists
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geometric-${{ inputs.geometric_target }}-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-evidence/
          if-no-files-found: warn
          retention-days: 30
  common:
    if: github.event_name == 'workflow_dispatch' && inputs.geometric_target == 'compare'
    needs: check
    uses: ./.github/workflows/geometric-stage.yml
    with:
      stage: common
  endpoints:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        endpoint: [candidate, previous, published]
    uses: ./.github/workflows/geometric-stage.yml
    with:
      stage: build-${{ matrix.endpoint }}
      source: common
  kernels:
    needs: endpoints
    strategy:
      fail-fast: false
      matrix:
        endpoint: [candidate, previous, published]
    uses: ./.github/workflows/geometric-stage.yml
    with:
      stage: kernel-${{ matrix.endpoint }}
      source: build-${{ matrix.endpoint }}
  audits:
    needs: endpoints
    strategy:
      fail-fast: false
      matrix:
        include:
          - {endpoint: candidate, source: build-candidate}
          - {endpoint: previous, source: build-previous}
          - {endpoint: published, source: build-published}
          - {endpoint: window, source: common}
    uses: ./.github/workflows/geometric-stage.yml
    with:
      stage: audit-${{ matrix.endpoint }}
      source: ${{ matrix.source }}
  comparison:
    needs: [kernels, audits]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: geometric-part-*-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-parts/
      - name: Compare the four declaration lists
        run: python3 -Bu results/geometric-window-descent/collect-comparison.py "$RUNNER_TEMP/geometric-parts" "$RUNNER_TEMP/geometric-evidence" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geometric-compare-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  unit-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.geometric_target == 'tame-eight-rh'
    needs: check
    uses: ./.github/workflows/geometric-stage.yml
    with:
      target: tame-eight-rh
      stage: build-inputs
  unit-endpoint:
    needs: unit-inputs
    uses: ./.github/workflows/geometric-stage.yml
    with:
      target: tame-eight-rh
      stage: build-endpoint
      source: build-inputs
  unit-verification:
    needs: unit-endpoint
    strategy:
      fail-fast: false
      matrix:
        stage: [kernel-endpoint, audit-endpoint]
    uses: ./.github/workflows/geometric-stage.yml
    with:
      target: tame-eight-rh
      stage: ${{ matrix.stage }}
      source: build-endpoint
