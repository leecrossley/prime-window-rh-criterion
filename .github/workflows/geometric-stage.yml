name: Geometric comparison stage
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: compare
      stage:
        required: true
        type: string
      source:
        default: ''
        type: string
      also:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the hosted runner for the archive
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          if (( $(sysctl -n vm.max_map_count) < 1048576 )); then
            sudo sysctl -w vm.max_map_count=1048576
          fi
      - name: Download the compiled modules from this run
        if: inputs.source != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geometric-objects-${{ inputs.source }}-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-checkpoint
      - name: Download the second branch of compiled modules
        if: inputs.also != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geometric-objects-${{ inputs.also }}-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-second-checkpoint
      - name: Replay the comparison stage
        env:
          TARGET: ${{ inputs.target }}
          STAGE: ${{ inputs.stage }}
          SOURCE_STAGE: ${{ inputs.source }}
          SECOND_SOURCE: ${{ inputs.also }}
        run: bash results/geometric-window-descent/hosted-replay.sh "$TARGET" "$STAGE" "$SOURCE_STAGE" "$SECOND_SOURCE"
      - name: Save the compiled modules
        if: inputs.stage == 'common' || startsWith(inputs.stage, 'build-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geometric-objects-${{ inputs.stage }}-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-saved/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      - name: Save the stage transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geometric-part-${{ inputs.stage }}-${{ github.sha }}
          path: ${{ runner.temp }}/geometric-evidence/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
